<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mente Acadêmica | Início</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <img class="imgLampada" src="img/imagem_lampada-removebg-preview.png">
    <div class="logo">MenteAcadêmica</div>
    <nav>
        <a href="ajuda.html" class="btn-emergency">Ajuda Imediata</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Olá! Como está seu humor hoje?</h1>
        
        <div class="mood-card">
            <p>Selecione um emoji para ver sua frase do dia:</p>
            <div class="mood-options">
                <button class="mood-btn" onclick="abrirPopUp('Radiante')">🤩</button>
                <button class="mood-btn" onclick="abrirPopUp('Bem')">🙂</button>
                <button class="mood-btn" onclick="abrirPopUp('Neutro')">😐</button>
                <button class="mood-btn" onclick="abrirPopUp('Exausto')">😫</button>
            </div>
        </div>
    </section>

    <div class="features-grid">
        <a href="diario.html" class="card-link">
            <div class="card">
                <div class="icon">📝</div>
                <h3>Mensagens</h3>
                <p>Veja depoimentos da comunidade.</p>
            </div>
        </a>

        <a href="quiz.html" class="card-link">
            <div class="card">
                <div class="icon">🎯</div>
                <h3>Quiz de Relato</h3>
                <p>Relate como você está se sentindo.</p>
            </div>
        </a>

        <a href="respiracao.html" class="card-link">
            <div class="card">
                <div class="icon">🧘</div>
                <h3>Respire</h3>
                <p>Exercício para acalmar a mente.</p>
            </div>
        </a>
    </div>

    <div id="modalFrase" class="modal">
        <div class="modal-content">
            <p id="textoFrase">Carregando frase...</p>
            <button class="btn-save" style="margin-top:20px" onclick="fecharPopUp()">Fechar</button>
        </div>
    </div>
</main>

<script>
    function abrirPopUp(humor) {
        // Quando você rodar o Python, ele buscará a frase real aqui:
        fetch(`/get_frase/${humor}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('textoFrase').innerText = data.frase;
                document.getElementById('modalFrase').style.display = 'block';
            })
            .catch(() => {
                // Caso o Python ainda não esteja rodando, mostra um aviso:
                document.getElementById('textoFrase').innerText = "Conecte o servidor Python para ver as frases do banco!";
                document.getElementById('modalFrase').style.display = 'block';
            });
    }
    function fecharPopUp() {
        document.getElementById('modalFrase').style.display = 'none';
    }
</script>

</body>
</html>
